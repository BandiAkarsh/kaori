# Edge OS — Calamares Settings
#
# Top-level configuration for the Edge OS system installer.
# Defines module search paths, instance overrides, sequence,
# branding, and global flags.
#
# Reference: https://github.com/calamares/calamares/wiki/Deploy-Configuration

modules-search: [ local ]

instances:
  - id:       unpack
    module:   unpackfs
    config:   unpackfs.conf

  - id:       install-grub
    module:   bootloader
    config:   bootloader.conf

  - id:       btrfs-layout
    module:   shellprocess
    config:   btrfs-layout.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - btrfs-layout
      - unpack
      - networkcfg
      - services
      - grubcfg
      - install-grub
      - initramfs
      - packages
  - show:
      - finished

branding:       edge
prompt-install: false
dont-chroot:    false
oem-setup:      false

disable-cancel:              false
disable-cancel-during-exec:  false
hide-back-and-next-during-exec: false
quit-at-end:                 true
