# Edge OS — Calamares Bootloader Module
#
# Installs GRUB as the system bootloader.
# Supports both BIOS (legacy) and EFI boot modes.

---
# Force GRUB installation to a specific disk
# Empty = user selects, or auto to the disk containing /
installPath: ""

# File name for the EFI boot entry
efiBootloaderId: "edge"

# GRUB installation target
# Options: "GRUB_FULL_INSTALL" (default), "GRUB_INSTALL", "GRUB_MKCONFIG"
grubInstall: GRUB_FULL_INSTALL

# EFI directory relative to /boot/efi
efiDir: "/EFI"

# Set this to true if using shim + signed GRUB
useSecureBoot: false
