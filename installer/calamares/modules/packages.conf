# Edge OS — Calamares Packages Module
#
# Post-install package management: install or remove packages
# after the base system has been unpacked.
# Uses APT backend for Debian compatibility.

---
# Package manager backend: apt for Debian Trixie
backend: apt

# Don't skip even without internet — user chose not to install extra pkgs
skip_if_no_internet: true

# Update package database before operations
update_db: true

# Don't do a full system upgrade after unpacking
# The squashfs is already up to date
update_system: false

# List of operations: install, remove, try_install, try_remove
# These run AFTER unpackfs, so they modify the target system
operations:

    # Install firmware and microcode for better hardware support
    -   install:
        - amd64-microcode
        - firmware-linux
        - firmware-linux-nonfree
        - firmware-iwlwifi
        - firmware-amd-graphics
        - firmware-realtek

    # Remove live-specific packages that shouldn't be on installed system
    -   remove:
        - calamares
