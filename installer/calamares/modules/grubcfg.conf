# Edge OS — Calamares GRUB Configuration Module
#
# Generates GRUB configuration for the installed system.
# Detects other operating systems and configures Edge OS as default boot entry.

---
# The filename to use as GRUB config (relative to /boot)
grubCfg: /boot/grub/grub.cfg

# Detect other operating systems
osProber: true

# Default boot entry (0-indexed)
# Edge OS is always entry 0
defaultBootEntry: "Edge OS"

# GRUB timeout in seconds
timeout: 5

# Kernel command line parameters to append
# These get added to GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub
kernelLine: "quiet splash loglevel=3"

# Set GRUB distribution string
distribution: "Edge OS"

# Write to GRUB configuration
writeToCfg: true
