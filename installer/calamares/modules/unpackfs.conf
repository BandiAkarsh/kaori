# Edge OS — Calamares Unpackfs Module
#
# Unpacks the Edge OS squashfs filesystem to the target installation.
# The squashfs is found on the live ISO at /run/live/boot/edge-rootfs.squashfs.
# (The initramfs bind-mounts the ISO into /run/live/ before switch_root.)

---
unpack:
    -   source: /run/live/boot/edge-rootfs.squashfs
        sourcefs: squashfs
        destination: ""
