# Edge OS — Calamares Welcome Module
#
# Welcome screen requirements and checks.
# Ensures the target system meets minimum hardware requirements.

---
# Require at least 2GB RAM for installation
requirements:
    requiredRam: 2
    requiredStorage: 10

    # Check requirements and show them as pass/fail
    required:
        - ram
        - storage
        - internet

    # These are optional — warn but don't block
    optional:
        - battery
        - power

# Enter the root partition manager directly on start
# false = show welcome first
enterDo: false

# URL to display for support
supportUrl: "https://edge-os.org/docs/"
