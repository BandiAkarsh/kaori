# Edge OS — Calamares Partition Module
#
# Partitioning configuration for the installer.
# Default: GPT partition table, Btrfs filesystem with subvolume layout.
# Supports manual partitioning and guided "replace partition" mode.
#
# Btrfs subvolumes (@, @home, @snapshots, @swap, @cache, @log)
# are created by the btrfs-layout shellprocess module after formatting.

---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        64MiB
    label:              "EFI"

# Swap configuration — swap file on @swap subvolume, no swap partition
ensureSuspendToDisk: false

# Allow manual partitioning in addition to guided
allowManualPartitioning: true

# Default partition table type for new layouts
partitionTableType: gpt

# Default filesystem — Btrfs with zstd compression for Edge OS
# Subvolumes are created by the btrfs-layout module after formatting
defaultFileSystemType: "btrfs"

# Btrfs mount options for the root partition
# Compression is applied per-subvolume in the btrfs-layout module
btrfs:
    swapFile:
        # No swap partition — swap file on @swap subvolume
        createSwapFile: false

# Allow LUKS encryption
enableLuksAutomatedPartitioning: false

# LVM configuration
lvm:
    enable: false

# Required storage in GiB
requiredStorage: 10

# Partition layout for automated installs (if used)
drawNestedPartitions: false

alwaysShowPartitionLabels: true
