# Edge OS — Calamares Btrfs Subvolume Layout Module
#
# Creates the Edge OS Btrfs subvolume layout after partitioning.
# Runs as a shellprocess module in the install sequence.
#
# Subvolumes created:
#   @, @home, @snapshots, @swap, @cache, @log
#
# This runs AFTER partition (which formats as Btrfs)
# and BEFORE mount (which mounts subvolumes to correct paths).

---
# Instance name to match in settings.conf
instance: btrfs-layout

# The script path is relative to this config file's directory
script: "../scripts/create-btrfs-layout.sh"

# The script is run with Calamares' chroot/non-chroot environment
# Run outside chroot since we need direct device access
dontChroot: true

# Timeout in seconds
timeout: 120
