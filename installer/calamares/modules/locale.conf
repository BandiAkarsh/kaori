# Edge OS — Calamares Locale Module
#
# Locale, timezone, and GeoIP configuration.
# Uses GeoIP to suggest timezone based on IP location.

---
# Use GeoIP to automatically suggest timezone
geoip:
    # GeoIP services: json (default), xml
    style: json
    url: "https://ipapi.co/timezone/"
    selector: ""

# Locale to generate and set as default
localeGenSystem: true

# Region and zone can be set automatically via GeoIP above
# If GeoIP fails, user can select manually
region: ""
zone: ""
