# Edge OS — Calamares Keyboard Module
#
# Keyboard layout configuration.
# Detects current layout and offers it as default.

---
# Use XKB model and layout configuration
# Empty values mean "auto-detect from live environment"
xkbModel: ""
xkbLayout: ""
xkbVariant: ""

# Prevent setting the layout at the console level
# Only set it for X11/Wayland (keep console layout as US)
setLayoutOnConsole: true
