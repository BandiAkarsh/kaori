# Edge OS — Calamares Users Module
#
# User account creation during installation.
# Creates a default user with sudo/audio/video/input group membership.

---
defaultGroups:
    - sudo
    - audio
    - video
    - input

# Require strong passwords
allowWeakPasswords: false

# Don't set root password — use sudo
setRootPassword: false

# Do not create the default group named after the user
doAutologin: false
