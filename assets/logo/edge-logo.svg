<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Anime-style soft gradient -->
    <radialGradient id="petalGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe0ec"/>
      <stop offset="60%" stop-color="#ffb3cc"/>
      <stop offset="100%" stop-color="#f28ba8"/>
    </radialGradient>
    <!-- Inner highlight -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fa3"/>
      <stop offset="100%" stop-color="#d44a6a"/>
    </radialGradient>
  </defs>

  <!-- Petal shape: clean, rounded, with cleft at tip -->
  <g id="petal">
    <path d="M0 0 
             C-30 -50, -50 -100, -45 -150
             C-42 -175, -30 -190, -18 -200
             C-8 -208, -3 -210, 0 -205
             C3 -210, 8 -208, 18 -200
             C30 -190, 42 -175, 45 -150
             C50 -100, 30 -50, 0 0Z"
          fill="url(#petalGrad)" stroke="#e87aa0" stroke-width="2" stroke-linejoin="round"/>
    <!-- Anime-style highlight line -->
    <path d="M-8 -40 C-15 -80, -18 -130, -10 -180"
          fill="none" stroke="#ffe8f0" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 5 petals rotated around center -->
  <use href="#petal" transform="translate(256,256) rotate(0)"/>
  <use href="#petal" transform="translate(256,256) rotate(72)"/>
  <use href="#petal" transform="translate(256,256) rotate(144)"/>
  <use href="#petal" transform="translate(256,256) rotate(216)"/>
  <use href="#petal" transform="translate(256,256) rotate(288)"/>

  <!-- Center of flower -->
  <circle cx="256" cy="256" r="22" fill="url(#centerGlow)" stroke="#a62c4a" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="15" fill="#ffb3cc" opacity="0.4"/>
  
  <!-- Anime-style stamens (simple, clean) -->
  <g stroke="#ffe8f0" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="256" y1="256" x2="256" y2="228"/>
    <line x1="256" y1="256" x2="240" y2="232"/>
    <line x1="256" y1="256" x2="272" y2="232"/>
    <line x1="256" y1="256" x2="228" y2="256"/>
    <line x1="256" y1="256" x2="284" y2="256"/>
    <line x1="256" y1="256" x2="240" y2="280"/>
    <line x1="256" y1="256" x2="272" y2="280"/>
    <line x1="256" y1="256" x2="256" y2="284"/>
  </g>
  
  <!-- Stamen tips -->
  <g fill="#ffffff">
    <circle cx="256" cy="228" r="3"/>
    <circle cx="240" cy="232" r="3"/>
    <circle cx="272" cy="232" r="3"/>
    <circle cx="228" cy="256" r="3"/>
    <circle cx="284" cy="256" r="3"/>
    <circle cx="240" cy="280" r="3"/>
    <circle cx="272" cy="280" r="3"/>
    <circle cx="256" cy="284" r="3"/>
  </g>

  <!-- Soft anime sparkle dots -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="200" cy="160" r="2.5"/>
    <circle cx="310" cy="200" r="2"/>
    <circle cx="190" cy="300" r="1.5"/>
    <circle cx="320" cy="310" r="2"/>
    <circle cx="170" cy="240" r="1.8"/>
  </g>
</svg>
