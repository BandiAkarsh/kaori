# Edge OS — SDDM Configuration
#
# Autologin for live mode. User 'edge' is automatically logged into
# the Hyprland Wayland session without a password prompt.
#
# Reference: sddm.conf(5)

[Autologin]
# Live session auto-login
User=edge
Session=hyprland.desktop
Relogin=true

[General]
# Halt on Halt command, reboot on Reboot command
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Users]
# Only show user 'edge' in the login screen (for live mode)
MaximumUid=1000
MinimumUid=1000

[Theme]
# No Current= set — uses SDDM's built-in default theme (no extra packages needed)
# Disable theme selector to speed up login
EnableThemeSelector=false

[Wayland]
# Enable HiDPI support
EnableHiDPI=true
# Session directory where Hyprland desktop file lives
SessionDir=/usr/share/wayland-sessions

[X11]
# Disable X11 — we run pure Wayland
DisplayCommand=
